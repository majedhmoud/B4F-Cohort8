<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="vendors/bootstrap/bootstrap.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container" style="height: 200px"></div>
    <div
      class="container-fluid"
      style="height: 200px; border: 1px solid black"
    ></div>
    <div class="container">
      <div id="carouselExampleFade" class="carousel slide carousel-fade">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="Images/ahmad.png" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="Images/ali.jpeg" class="d-block w-100" alt="..." />
          </div>
          <div class="carousel-item">
            <img src="Images/yazan.png" class="d-block w-100" alt="..." />
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#carouselExampleFade"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#carouselExampleFade"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <script src="vendors/bootstrap/bootstrap.bundle.js" defer></script>
  </body>
</html>
